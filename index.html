<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Família Pagode • Equipe Tenebrosa</title>
<style>
body{margin:0;background:#080403;color:#fff;font-family:Arial,sans-serif;text-align:center}
main{max-width:900px;margin:auto;padding:20px}
h1{font-size:clamp(40px,7vw,76px);color:#ffd45a;margin:10px}
.sub{color:#fff;border:1px solid #ffd45a;border-radius:30px;display:inline-block;padding:8px 22px;font-weight:bold}
.player{margin-top:20px;padding:25px;border:1px solid #ffd45a;border-radius:25px;background:#120906}
.live{color:#ff5148;font-weight:bold;letter-spacing:3px}.dot{display:inline-block;width:10px;height:10px;background:red;border-radius:50%}
#dj{color:#ffd45a;font-size:24px;font-weight:bold;margin-top:18px}
#track{font-size:22px;font-weight:bold;margin:8px}
#eq{height:150px;display:flex;align-items:end;justify-content:center;gap:5px}
.bar{width:7px;background:linear-gradient(#fff1a8,#ffad00,#d71920);border-radius:8px 8px 2px 2px;height:10px}
button{margin:15px;padding:15px 30px;border:0;border-radius:30px;background:#ffd45a;font-size:18px;font-weight:bold;cursor:pointer}
#status{color:#bbb;font-size:13px}
footer{margin-top:25px;color:#ddd}
</style>
</head>
<body>
<main>
<h1>FAMÍLIA PAGODE</h1>
<div class="sub">EQUIPE TENEBROSA</div>
<p>🎶 MÚSICA BOA, ALEGRIA SEM LIMITES! 🎶</p>
<section class="player">
<div class="live"><span class="dot"></span> RÁDIO AO VIVO</div>
<div id="dj">🎧 Consultando transmissão...</div>
<div id="track">🎵 Carregando música...</div>
<div id="eq"></div>
<button id="play">▶ OUVIR AGORA</button>
<div id="status">Conectando à rádio...</div>
<audio id="audio" preload="none" crossorigin="anonymous"></audio>
</section>
<footer>🔥 Música • Alegria • Amizade • Festa 🔥</footer>
</main>
<script>
const API='https://azura5.cmaudioevideo.com/api/nowplaying/equipe_tenebrosa';
const STATIC='https://azura5.cmaudioevideo.com/api/nowplaying_static/equipe_tenebrosa.json';
const audio=document.getElementById('audio'),btn=document.getElementById('play'),eq=document.getElementById('eq');
const dj=document.getElementById('dj'),track=document.getElementById('track'),status=document.getElementById('status');
let streamUrl='',ctx=null,analyser=null,data=null,source=null,raf=null;
for(let i=0;i<48;i++){let b=document.createElement('span');b.className='bar';eq.appendChild(b)}

function text(v){return v==null?'':String(v)}
function update(d){
 const s=d?.now_playing?.song||{}, live=d?.live?.is_live;
 const name=d?.live?.streamer_name||d?.live?.streamer_display_name;
 dj.textContent=live&&name?'🎧 AO VIVO: '+text(name):'🎧 AUTO DJ / PROGRAMAÇÃO';
 track.textContent='🎵 '+((s.artist?text(s.artist)+' — ':'')+(s.title?text(s.title):'Rádio ao vivo'));
 if(!streamUrl&&d?.station?.listen_url){streamUrl=d.station.listen_url;audio.src=streamUrl}
 status.textContent='Rádio conectada • atualização automática';
}
async function now(){
 try{let r=await fetch(API,{cache:'no-store'});if(!r.ok)throw 0;update(await r.json())}
 catch(e){try{let r=await fetch(STATIC,{cache:'no-store'});if(!r.ok)throw 0;update(await r.json())}catch(x){status.textContent='Aguardando conexão com os dados da rádio...'}}
}
async function analyzer(){
 if(analyser)return true;
 try{
  ctx=new(window.AudioContext||window.webkitAudioContext)();
  source=ctx.createMediaElementSource(audio);
  analyser=ctx.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.7;
  source.connect(analyser);analyser.connect(ctx.destination);data=new Uint8Array(analyser.frequencyBinCount);
  return true
 }catch(e){return false}
}
function draw(){
 if(!analyser)return;
 analyser.getByteFrequencyData(data);
 [...eq.children].forEach((b,i)=>{let v=data[Math.floor(i*data.length/eq.children.length)]||0;b.style.height=(6+v*.45)+'px';b.style.opacity=.45+v/510});
 raf=requestAnimationFrame(draw)
}
async function start(){
 if(!streamUrl)await now();
 if(!audio.src&&streamUrl)audio.src=streamUrl;
 try{
  let ok=await analyzer();
  if(ctx?.state==='suspended')await ctx.resume();
  await audio.play();
  if(ok){cancelAnimationFrame(raf);draw();status.textContent='🔴 Rádio tocando • equalizador ativo'}
  btn.textContent='⏸ PAUSAR RÁDIO';
 }catch(e){status.textContent='Clique novamente em OUVIR AGORA para iniciar.'}
}
function pause(){
 audio.pause();cancelAnimationFrame(raf);btn.textContent='▶ OUVIR AGORA';status.textContent='Rádio pausada.'
}
btn.onclick=()=>audio.paused?start():pause();
audio.onplaying=()=>btn.textContent='⏸ PAUSAR RÁDIO';
audio.onpause=()=>btn.textContent='▶ OUVIR AGORA';
now();setInterval(now,15000);
</script>
</body>
</html>
